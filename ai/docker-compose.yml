services:
  ollama:
    image: ollama/ollama:0.34.3
    container_name: ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - type: volume
        source: ollama_data
        target: /root/.ollama
        volume:
          nocopy: true
      - ./ollama/Modelfile_qwen_2_5_3b_instruct:/Modelfile:ro
    ports:
      # Localhost only (ai/terraform's ollama provider) - Ollama has no auth.
      - "127.0.0.1:11434:11434"

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1
    container_name: litellm
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - "--config"
      - "/app/config.yaml"
    env_file:
      - litellm.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`litellm.oskarrosen.io`)"
      - "traefik.http.routers.litellm.entrypoints=web,web_secure"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.routers.litellm.tls.certresolver=lets_encrypt"
      - "traefik.http.routers.litellm.middlewares=lan-only@file"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - media-services_default
      - traefik_internal

  ollama-exporter:
    image: ghcr.io/maravexa/ollama-exporter:v0.3.1
    container_name: ollama-exporter
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  searxng:
    image: searxng/searxng:2026.9.22-b3c389529
    container_name: searxng
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    env_file:
      - searxng.env
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - type: volume
        source: searxng_data
        target: /var/cache/searxng
        volume:
          nocopy: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`searxng.oskarrosen.io`)"
      - "traefik.http.routers.searxng.entrypoints=web,web_secure"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.tls.certresolver=lets_encrypt"
      - "traefik.http.routers.searxng.middlewares=lan-only@file"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
      - "traefik.http.routers.searxng.service=searxng"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - traefik_internal

  openwebui:
    image: openwebui/open-webui:0.11.4-slim
    container_name: openwebui
    restart: unless-stopped
    env_file:
      - openwebui.env
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # LiteLLM connection, alongside the native Ollama one above, so chat can
      # use either a directly-pulled Ollama model or anything LiteLLM routes
      # (caching/fallback/observability) without giving up Ollama model
      # management (pulling new models still needs the native connection).
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      # OPENAI_API_KEYS (the LiteLLM key) lives in openwebui.env, not here.
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
    volumes:
      - type: volume
        source: openwebui_data
        target: /app/backend/data
        volume:
          nocopy: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`openwebui.oskarrosen.io`)"
      - "traefik.http.routers.openwebui.entrypoints=web,web_secure"
      - "traefik.http.routers.openwebui.tls=true"
      - "traefik.http.routers.openwebui.tls.certresolver=lets_encrypt"
      - "traefik.http.routers.openwebui.middlewares=lan-only@file"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
      - "traefik.http.routers.openwebui.service=openwebui"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - traefik_internal

volumes:
  ollama_data:
    external: true
    name: ai_ollama_data
  openwebui_data:
    external: true
    name: ai_openwebui_data
  searxng_data:

networks:
  traefik_internal:
    external: true
  media-services_default:
    external: true
