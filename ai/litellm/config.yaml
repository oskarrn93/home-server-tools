model_list:
  # Local ollama container (this host, weaker/CPU-only box) - general text model.
  - model_name: qwen3.5-4b-custom
    litellm_params:
      model: ollama/qwen3.5-4b-custom
      api_base: http://ollama:11434

  # Remote ollama host (192.168.1.17, GPU box) - vision-capable model used by
  # Immich smart search/analyze and Paperless-AI document tagging.
  - model_name: qwen3-vl:4b-thinking-q4_K_M
    litellm_params:
      model: ollama/qwen3-vl:4b-thinking-q4_K_M
      api_base: http://192.168.1.17:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    username: os.environ/REDIS_USERNAME
    password: os.environ/REDIS_PASSWORD
    db: os.environ/REDIS_DB
    namespace: litellm
