model_list:
  # Local ollama container (this host, weaker/CPU-only box) - general text
  # model, fallback for qwen3-vl:4b-thinking-q4_K_M when desktop.oskarrosen.io is down.
  - model_name: qwen3.5:4b
    litellm_params:
      model: ollama/qwen3.5:4b
      api_base: http://ollama:11434

  # Remote ollama host (desktop.oskarrosen.io, GPU box) - vision-capable model used by
  # Immich smart search/analyze and Paperless-AI document tagging. Preferred
  # deployment; falls back to local ollama (see litellm_settings.fallbacks
  # below) if this host is unreachable.
  - model_name: qwen3-vl:4b-thinking-q4_K_M
    litellm_params:
      model: ollama/qwen3-vl:4b-thinking-q4_K_M
      api_base: http://desktop.oskarrosen.io:11434
      timeout: 5

  # Local ollama container - vision-capable fallback for when desktop.oskarrosen.io
  # is down. Requires `ollama pull llava:7b` on this host.
  - model_name: llava:7b
    litellm_params:
      model: ollama/llava:7b
      api_base: http://ollama:11434

  # Remote ollama host (desktop.oskarrosen.io, GPU box) - lightweight text model,
  # used by n8n's Instance AI. Preferred deployment; falls back to local
  # ollama (see litellm_settings.fallbacks below) if this host is
  # unreachable.
  - model_name: qwen2.5:3b-instruct
    litellm_params:
      model: ollama/qwen2.5:3b-instruct
      api_base: http://desktop.oskarrosen.io:11434
      timeout: 5

  # Local ollama container - fallback for qwen2.5:3b-instruct when
  # desktop.oskarrosen.io is down. Requires `ollama pull qwen2.5:3b-instruct` on
  # this host.
  - model_name: qwen2.5:3b-instruct-local
    litellm_params:
      model: ollama/qwen2.5:3b-instruct
      api_base: http://ollama:11434

  # Remote ollama host (desktop.oskarrosen.io, GPU box) - embedding model used
  # by paperless-ngx's native AI (semantic search/RAG). Preferred deployment;
  # falls back to local ollama (see litellm_settings.fallbacks below) if this
  # host is unreachable. Requires `ollama pull nomic-embed-text` on that host.
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://desktop.oskarrosen.io:11434
      timeout: 5

  # Local ollama container - fallback for nomic-embed-text when
  # desktop.oskarrosen.io is down. Requires `ollama pull nomic-embed-text` on
  # this host.
  - model_name: nomic-embed-text-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  callbacks: ["otel", "prometheus"]
  # Ollama's OpenAI-compat layer rejects params some OpenAI-compatible
  # clients send by default (e.g. llama_index/paperless-ngx send
  # encoding_format=base64 for embeddings and parallel_tool_calls for
  # tool-calling chat) - silently drop unsupported params instead of erroring.
  drop_params: true
  # If the desktop.oskarrosen.io deployment errors/times out, retry against the local
  # text model first; llava:7b is a last resort since it's only needed for
  # image inputs, which qwen3.5:4b can't handle.
  fallbacks:
    - qwen3-vl:4b-thinking-q4_K_M: ["qwen3.5:4b", "llava:7b"]
    - qwen2.5:3b-instruct: ["qwen2.5:3b-instruct-local"]
    - nomic-embed-text: ["nomic-embed-text-local"]
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    username: os.environ/REDIS_USERNAME
    password: os.environ/REDIS_PASSWORD
    db: os.environ/REDIS_DB
    namespace: litellm
