# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/
#
# server.secret_key and valkey.url are supplied via SEARXNG_SECRET and
# SEARXNG_VALKEY_URL in searxng.env instead of being hardcoded here.

use_default_settings: true

general:
  enable_metrics: true
  # Password for the /metrics (OpenMetrics) endpoint's HTTP Basic Auth.
  # SearXNG has no SEARXNG_* env-var override for `open_metrics` (unlike
  # secret_key/valkey.url below), so it can't live in the gitignored
  # searxng.env and has to be committed here instead. It only gates read-only
  # metrics, reachable over the ai_default Docker network or via the LAN-only
  # (lan-only@file) searxng.oskarrosen.io Traefik router.
  open_metrics: "searxng-metrics-b3f7a1c9d4e26058"

server:
  image_proxy: true

search:
  formats:
    - html
    - json
