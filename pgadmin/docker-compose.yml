services:
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    env_file:
      - .env
    environment:
      # Without this, servers.json is only applied once, when pgAdmin first creates
      # its config DB - later edits to the file would otherwise be silently ignored
      # on restart. This makes servers.json the actual source of truth every start.
      # Must be the literal string "True" (capital T) - entrypoint.sh does a bash
      # `= "True"` comparison, so "true"/"1"/etc silently no-op with no error/log.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # No nocopy here (unlike the other stacks in this repo) - the pgAdmin image
      # runs as uid 5050 and its /var/lib/pgadmin is pre-owned for that user, so a
      # fresh named volume must be seeded from image content (Docker's normal
      # behavior) to inherit that ownership. nocopy leaves it root-owned instead,
      # which the pgadmin user then can't write to (e.g. its sessions directory).
      - type: volume
        source: pgadmin_data
        target: /var/lib/pgadmin
      - ./config_local.py:/pgadmin4/config_local.py:ro
      - ./servers.json:/pgadmin4/servers.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.oskarrosen.io`)"
      - "traefik.http.routers.pgadmin.entrypoints=web,web_secure"
      - "traefik.http.routers.pgadmin.tls=true"
      - "traefik.http.routers.pgadmin.tls.certresolver=lets_encrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - traefik_internal

volumes:
  pgadmin_data:

networks:
  traefik_internal:
    external: true
