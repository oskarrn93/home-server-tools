http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200

    fail2ban:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "3h"
            findtime: "10m"
            maxretry: 20
            statuscode: "400,401,403-428,430-498"

    fail2ban-strict:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "24h"
            findtime: "5m"
            maxretry: 5
            statuscode: "401,403"

    fail2ban-404:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "6h"
            findtime: "5m"
            maxretry: 30
            statuscode: "404"
