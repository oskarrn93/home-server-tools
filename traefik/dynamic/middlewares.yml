http:
  middlewares:
    # Put first on every LAN-only router. DNS alone doesn't keep those hosts
    # private: Traefik routes on the Host header, so anyone reaching :443 on
    # the public IP can name any hostname. Traefik sees real client IPs
    # (Docker DNATs published ports); requests from the host itself or from
    # other containers arrive from a Docker bridge gateway in 172.16.0.0/12.
    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.1.0/24"
          - "172.16.0.0/12"
          - "127.0.0.1/32"

    ratelimit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200

    fail2ban:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "3h"
            findtime: "10m"
            maxretry: 20
            statuscode: "400,401,403-428,430-498"

    fail2ban-strict:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "24h"
            findtime: "5m"
            maxretry: 5
            statuscode: "401,403"

    fail2ban-404:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "6h"
            findtime: "5m"
            maxretry: 30
            statuscode: "404"
