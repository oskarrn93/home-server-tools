http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 100
        period: 1s
        burst: 200

    fail2ban:
      plugin:
        fail2ban:
          allowlist:
            ip:
              - "192.168.1.0/24"
          rules:
            bantime: "3h"
            findtime: "10m"
            maxretry: 20
            statuscode: "400,401,403-428,430-498"
