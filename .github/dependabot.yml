version: 2
updates:
  # Every stack lives in its own subdirectory; "/" alone only scans the repo
  # root, which has no Dockerfile or compose file.
  - package-ecosystem: "docker"
    directories: ["/healthcheck"]
    schedule:
      interval: "daily"
  - package-ecosystem: "docker-compose"
    directories: ["/*"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
  - package-ecosystem: "gomod"
    directories: ["/healthcheck"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directories: ["/ai/terraform", "/auth/terraform"]
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directories: ["/"]
    schedule:
      interval: "weekly"
