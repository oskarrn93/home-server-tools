---
- name: Miscellaneous host kernel/sysctl tuning
  hosts: localhost
  become: true
  gather_facts: false

  tasks:
    - name: Raise inotify watch/instance limits (Immich library watcher hits ENOSPC otherwise)
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-inotify.conf
        reload: true
      loop:
        - { name: fs.inotify.max_user_watches, value: "1048576" }
        - { name: fs.inotify.max_user_instances, value: "512" }
