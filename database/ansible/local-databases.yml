---
- name: Install PostgreSQL and MariaDB locally
  hosts: localhost
  become: true
  gather_facts: true

  vars_files:
    - vars/local-databases.yml

  tasks:
    - name: Install database packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - mariadb-server
          - mariadb-client
          - valkey-server
          - valkey-tools
          - ufw
          - python3-psycopg2
          - python3-pymysql
        state: present
        update_cache: true

    - name: Install pgvector for PostgreSQL {{ postgresql_version }} (VectorChord dependency, for Immich)
      ansible.builtin.apt:
        name: "postgresql-{{ postgresql_version }}-pgvector"
        state: present

    - name: Download the VectorChord package (for Immich)
      ansible.builtin.get_url:
        url: "https://github.com/tensorchord/VectorChord/releases/download/{{ vectorchord_version }}/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}-1_amd64.deb"
        dest: "/tmp/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}.deb"
        mode: "0644"

    - name: Install the VectorChord package (for Immich)
      ansible.builtin.apt:
        deb: "/tmp/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}.deb"
        state: present

    - name: Ensure PostgreSQL is enabled and started
      ansible.builtin.service:
        name: postgresql
        enabled: true
        state: started

    - name: Ensure MariaDB is enabled and started
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    - name: Ensure Valkey is enabled and started
      ansible.builtin.service:
        name: valkey-server
        enabled: true
        state: started

    - name: Allow MariaDB connections from Docker networks
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^\s*bind-address\s*='
        line: "bind-address = 0.0.0.0"
      notify: Restart MariaDB

    - name: Allow MariaDB from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "3306"
        proto: tcp

    - name: Allow PostgreSQL to listen on all interfaces
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^#?\s*listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Preload the VectorChord library (for Immich)
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^#?\s*shared_preload_libraries\s*='
        line: "shared_preload_libraries = 'vchord'"
      notify: Restart PostgreSQL

    - name: Allow PostgreSQL connections from Docker networks
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_hba_path }}"
        contype: host
        databases: all
        users: all
        source: "{{ docker_network }}"
        method: scram-sha-256
      notify: Restart PostgreSQL

    - name: Allow PostgreSQL from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "5432"
        proto: tcp

    - name: Allow Valkey to listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^bind\s'
        line: "bind * -::*"
      notify: Restart Valkey

    - name: Set the Valkey default-user password
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*requirepass\s'
        line: "requirepass {{ valkey_root_password }}"
      notify: Restart Valkey

    - name: Enable Valkey AOF persistence
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^appendonly\s'
        line: "appendonly yes"
      notify: Restart Valkey

    - name: Ensure the Valkey ACL file exists
      ansible.builtin.copy:
        dest: /etc/valkey/users.acl
        content: ""
        force: false
        owner: valkey
        group: valkey
        mode: "0640"

    # Without an aclfile, ACL SETUSER only lives in memory and every user created
    # below is silently wiped out on the next Valkey restart/reboot.
    - name: Configure the Valkey ACL file
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*aclfile\s'
        line: "aclfile /etc/valkey/users.acl"
      notify: Restart Valkey

    - name: Allow Valkey from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "6379"
        proto: tcp

    - name: Apply service restarts before configuring users/ACLs over the network
      ansible.builtin.meta: flush_handlers

    - name: Ensure PostgreSQL user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
        role_attr_flags: CREATEDB,SUPERUSER
        state: present
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Ensure PostgreSQL database exists
      community.postgresql.postgresql_db:
        name: "{{ postgres_db }}"
        owner: "{{ postgres_user }}"
        state: present
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Ensure PostgreSQL root password is set
      community.postgresql.postgresql_user:
        name: "{{ postgres_root_user }}"
        password: "{{ postgres_root_password }}"
        role_attr_flags: SUPERUSER
        state: present
      become_user: postgres
      when: postgres_root_password is defined and postgres_root_password | length > 0

    - name: Ensure PostgreSQL exporter user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_exporter_user }}"
        password: "{{ postgres_exporter_password }}"
        state: present
      become_user: postgres

    - name: Grant pg_monitor to the PostgreSQL exporter user
      community.postgresql.postgresql_membership:
        group: pg_monitor
        target_role: "{{ postgres_exporter_user }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL Grafana user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_grafana_user }}"
        password: "{{ postgres_grafana_password }}"
        state: present
      become_user: postgres

    - name: Grant pg_read_all_data to the PostgreSQL Grafana user
      community.postgresql.postgresql_membership:
        group: pg_read_all_data
        target_role: "{{ postgres_grafana_user }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL user exists for Immich
      community.postgresql.postgresql_user:
        name: "{{ immich_user }}"
        password: "{{ immich_password }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL database exists for Immich
      community.postgresql.postgresql_db:
        name: "{{ immich_db }}"
        owner: "{{ immich_user }}"
        state: present
      become_user: postgres

    # Immich needs VectorChord (vchord, superuser-only) for embeddings and
    # earthdistance (which cascades in its cube dependency) for geo search -
    # both are created here as the postgres superuser, then left owned by
    # that database rather than the immich_user role.
    - name: Ensure the vchord extension exists in the Immich database
      community.postgresql.postgresql_ext:
        db: "{{ immich_db }}"
        name: vchord
        cascade: true
        state: present
      become_user: postgres

    - name: Ensure the earthdistance extension exists in the Immich database
      community.postgresql.postgresql_ext:
        db: "{{ immich_db }}"
        name: earthdistance
        cascade: true
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL user exists for Mealie
      community.postgresql.postgresql_user:
        name: "{{ mealie_user }}"
        password: "{{ mealie_password }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL database exists for Mealie
      community.postgresql.postgresql_db:
        name: "{{ mealie_db }}"
        owner: "{{ mealie_user }}"
        state: present
      become_user: postgres

    - name: Ensure MariaDB root password is set
      community.mysql.mysql_user:
        name: "{{ mariadb_root_user }}"
        password: "{{ mariadb_root_password }}"
        plugin: mysql_native_password
        login_unix_socket: /run/mysqld/mysqld.sock
        login_user: "{{ mariadb_root_user }}"
        login_password: "{{ mariadb_root_password }}"
        check_implicit_admin: true
        state: present
      when: mariadb_root_password is defined and mariadb_root_password | length > 0

    - name: Ensure MariaDB app user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_user }}"
        password: "{{ mariadb_password }}"
        host: localhost
        priv: "{{ mariadb_database }}.*:ALL,GRANT"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB database exists
      community.mysql.mysql_db:
        name: "{{ mariadb_database }}"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB exporter user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_exporter_user }}"
        password: "{{ mariadb_exporter_password }}"
        host: "%"
        priv:
          "*.*": "PROCESS,REPLICATION CLIENT,SLAVE MONITOR"
          "performance_schema.*": "SELECT"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB Grafana user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_grafana_user }}"
        password: "{{ mariadb_grafana_password }}"
        host: "%"
        priv:
          "*.*": "SELECT,PROCESS"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Configure Uptime Kuma database connection
      ansible.builtin.copy:
        dest: "{{ uptime_kuma_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          DB_TYPE=mysql
          DB_HOST={{ uptime_kuma_db_host }}
          DB_PORT={{ uptime_kuma_db_port }}
          DB_NAME={{ uptime_kuma_db_name }}
          DB_USER={{ uptime_kuma_db_user }}
          DB_PASSWORD={{ uptime_kuma_db_password }}

    # Once aclfile is configured (above), Valkey sources the default user's
    # credentials from that file, not from requirepass in valkey.conf - requirepass
    # only seeds the default user when no aclfile is in use. The aclfile task creates
    # an empty users.acl, so without this the default user ends up on `nopass`
    # regardless of requirepass. On the very first run the default user has no
    # password yet, so this -a auth attempt itself gets rejected by the server (a
    # benign stderr warning, not a real failure - see failed_when below); the
    # ACL SETUSER still goes through because auth isn't required yet.
    - name: Ensure the Valkey default user's password matches requirepass
      ansible.builtin.command:
        argv:
          - valkey-cli
          - --no-auth-warning
          - -a
          - "{{ valkey_root_password }}"
          - -h
          - "{{ valkey_host }}"
          - -p
          - "{{ valkey_port | string }}"
          - ACL
          - SETUSER
          - default
          - "on"
          - ">{{ valkey_root_password }}"
          - "~*"
          - "&*"
          - "+@all"
      register: valkey_acl_default
      changed_when: true
      failed_when: "'ERR' in valkey_acl_default.stdout"
      no_log: true

    # Valkey ACL has no per-database restriction - a `db=N` SETUSER modifier is a
    # syntax error, not a scoping rule. The actual db isolation for these users
    # comes from Immich/SearXNG selecting their own db index after connecting.
    # valkey-cli also exits 0 even when the server replies with an error, so this
    # is registered and explicitly checked rather than trusting changed_when alone.
    - name: Ensure Valkey ACL user exists for SearXNG
      ansible.builtin.command:
        argv:
          - valkey-cli
          - --no-auth-warning
          - -a
          - "{{ valkey_root_password }}"
          - -h
          - "{{ valkey_host }}"
          - -p
          - "{{ valkey_port | string }}"
          - ACL
          - SETUSER
          - "{{ valkey_searxng_user }}"
          - "on"
          - ">{{ valkey_searxng_password }}"
          - "~*"
          - "&*"
          - "+@all"
          - "-@admin"
          - "-@dangerous"
      register: valkey_acl_searxng
      changed_when: true
      # stderr can contain a benign "AUTH failed: ERR ..." diagnostic from valkey-cli
      # itself when the default user currently has no password set - only stdout
      # carries the actual ACL SETUSER reply, so only check that for a real error.
      failed_when: "'ERR' in valkey_acl_searxng.stdout"
      no_log: true

    - name: Ensure Valkey ACL user exists for Immich
      ansible.builtin.command:
        argv:
          - valkey-cli
          - --no-auth-warning
          - -a
          - "{{ valkey_root_password }}"
          - -h
          - "{{ valkey_host }}"
          - -p
          - "{{ valkey_port | string }}"
          - ACL
          - SETUSER
          - "{{ valkey_immich_user }}"
          - "on"
          - ">{{ valkey_immich_password }}"
          - "~*"
          # Key access (~) and pub/sub channel access (&) are separate grants in
          # Valkey ACLs - Immich's microservices worker uses Redis pub/sub for
          # BullMQ job events and fails with NOPERM without &* too.
          - "&*"
          - "+@all"
          - "-@admin"
          - "-@dangerous"
          # ioredis (Immich's Redis client) runs INFO as part of its startup ready
          # check; -@dangerous strips it like it does for the exporter user above,
          # so it needs the same explicit re-grant after the category denials.
          - "+info"
      register: valkey_acl_immich
      changed_when: true
      failed_when: "'ERR' in valkey_acl_immich.stdout"
      no_log: true

    - name: Ensure Valkey ACL user exists for the Prometheus exporter
      ansible.builtin.command:
        argv:
          - valkey-cli
          - --no-auth-warning
          - -a
          - "{{ valkey_root_password }}"
          - -h
          - "{{ valkey_host }}"
          - -p
          - "{{ valkey_port | string }}"
          - ACL
          - SETUSER
          - "{{ valkey_exporter_user }}"
          - "on"
          - ">{{ valkey_exporter_password }}"
          - "~*"
          - "&*"
          - "+@read"
          - "+@connection"
          - "-@admin"
          - "-@dangerous"
          # ACL rules apply in order, so these specific grants must come after the
          # category denials above - otherwise -@dangerous silently revokes them
          # (INFO/CONFIG/CLIENT/LATENCY/SLOWLOG/MEMORY subcommands are in @dangerous).
          - "+ping"
          - "+info"
          - "+config|get"
          - "+client|list"
          - "+client|info"
          - "+latency|history"
          - "+latency|latest"
          - "+latency|histogram"
          - "+slowlog|get"
          - "+memory|usage"
          - "+memory|stats"
          - "+cluster|info"
      register: valkey_acl_exporter
      changed_when: true
      failed_when: "'ERR' in valkey_acl_exporter.stdout"
      no_log: true

    - name: Persist the Valkey ACL to disk if an ACL file is configured
      ansible.builtin.command:
        argv:
          - valkey-cli
          - --no-auth-warning
          - -a
          - "{{ valkey_root_password }}"
          - -h
          - "{{ valkey_host }}"
          - -p
          - "{{ valkey_port | string }}"
          - ACL
          - SAVE
      register: valkey_acl_save
      changed_when: false
      failed_when: false

    - name: Show Valkey ACL persistence result
      ansible.builtin.debug:
        msg: >-
          {{ valkey_acl_save.stdout | default('') }}
          {{ valkey_acl_save.stderr | default('') }}
          (if this reports no ACL file is configured, the user lives in memory only
          and ACL SETUSER must be re-run after a Valkey restart)

    - name: Write PostgreSQL exporter env file for server-observability
      ansible.builtin.copy:
        dest: "{{ postgres_exporter_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          DATA_SOURCE_NAME=postgresql://{{ postgres_exporter_user }}:{{ postgres_exporter_password }}@{{ docker_gateway_ip }}:5432/{{ postgres_db }}?sslmode=disable

    - name: Write MariaDB exporter my.cnf for server-observability
      ansible.builtin.copy:
        dest: "{{ mariadb_exporter_cnf_file }}"
        owner: oskar
        group: oskar
        # mysqld_exporter (v0.15+) reads credentials from this file directly, running as an
        # unprivileged container user - it must be world-readable like uptime-kuma-metrics-token.
        mode: "0644"
        content: |
          [client]
          user = {{ mariadb_exporter_user }}
          password = {{ mariadb_exporter_password }}

    - name: Write Valkey exporter env file for server-observability
      ansible.builtin.copy:
        dest: "{{ valkey_exporter_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          REDIS_ADDR=redis://{{ docker_gateway_ip }}:{{ valkey_port }}
          REDIS_USER={{ valkey_exporter_user }}
          REDIS_PASSWORD={{ valkey_exporter_password }}

    - name: Show database connection info
      ansible.builtin.debug:
        msg:
          - "PostgreSQL: postgresql://{{ postgres_user }}:{{ postgres_password }}@localhost:5432/{{ postgres_db }}"
          - "PostgreSQL (Grafana): postgresql://{{ postgres_grafana_user }}:{{ postgres_grafana_password }}@localhost:5432/{{ postgres_db }}"
          - "MariaDB: mysql://{{ mariadb_user }}:{{ mariadb_password }}@localhost:3306/{{ mariadb_database }}"
          - "MariaDB (Grafana): mysql://{{ mariadb_grafana_user }}:{{ mariadb_grafana_password }}@localhost:3306/mysql"
          - "Valkey (searxng): valkey://{{ valkey_searxng_user }}:{{ valkey_searxng_password }}@{{ valkey_host }}:{{ valkey_port }}/{{ valkey_searxng_db }}"
          - "PostgreSQL (Immich): postgresql://{{ immich_user }}:{{ immich_password }}@localhost:5432/{{ immich_db }}"
          - "Valkey (Immich): valkey://{{ valkey_immich_user }}:{{ valkey_immich_password }}@{{ valkey_host }}:{{ valkey_port }}/{{ valkey_immich_db }}"
          - "PostgreSQL (Mealie): postgresql://{{ mealie_user }}:{{ mealie_password }}@localhost:5432/{{ mealie_db }}"
          - "Put the Grafana lines above into server-observability/terraform.tfvars as postgres_grafana_user/password and mariadb_grafana_user/password."
          - "Put the Immich lines above into media-services/immich.env as DB_HOSTNAME=host.docker.internal/DB_USERNAME/DB_PASSWORD/DB_DATABASE_NAME and REDIS_HOSTNAME=host.docker.internal/REDIS_USERNAME/REDIS_PASSWORD/REDIS_DBINDEX."
          - "Put the Mealie line above into media-services/mealie.env as POSTGRES_SERVER=host.docker.internal/POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB."

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted

    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Restart Valkey
      ansible.builtin.service:
        name: valkey-server
        state: restarted
