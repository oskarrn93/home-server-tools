---
- name: Install PostgreSQL and MariaDB locally
  hosts: localhost
  become: true
  gather_facts: true

  vars_files:
    - vars/local-databases.yml

  vars:
    valkey_cli:
      - valkey-cli
      - --no-auth-warning
      - -a
      - "{{ valkey_root_password }}"
      - -h
      - "{{ valkey_host }}"
      - -p
      - "{{ valkey_port | string }}"
    # One database + owner role per app on the shared PostgreSQL instance.
    postgres_app_databases:
      - { name: Immich, db: "{{ immich_db }}", user: "{{ immich_user }}", password: "{{ immich_password }}" }
      - { name: Mealie, db: "{{ mealie_db }}", user: "{{ mealie_user }}", password: "{{ mealie_password }}" }
      - { name: Paperless-ngx, db: "{{ paperless_db }}", user: "{{ paperless_user }}", password: "{{ paperless_password }}" }
      - { name: LiteLLM, db: "{{ litellm_db }}", user: "{{ litellm_user }}", password: "{{ litellm_password }}" }
      - { name: Seerr, db: "{{ seerr_db }}", user: "{{ seerr_user }}", password: "{{ seerr_password }}" }
      - { name: Pocket ID, db: "{{ pocketid_db }}", user: "{{ pocketid_user }}", password: "{{ pocketid_password }}" }
      - { name: tinyauth, db: "{{ tinyauth_db }}", user: "{{ tinyauth_user }}", password: "{{ tinyauth_password }}" }
    # Valkey ACL rules apply in order, so specific grants (+info, ...) must come
    # after the category denials - otherwise -@dangerous silently revokes them.
    # Key access (~) and pub/sub channel access (&) are separate grants; Immich's
    # BullMQ job events need &*. ioredis (Immich) and friends run INFO as part of
    # their startup ready check, which -@dangerous would strip.
    valkey_app_rules: ["~*", "&*", "+@all", "-@admin", "-@dangerous", "+info"]
    valkey_acl_users:
      - user: "{{ valkey_searxng_user }}"
        password: "{{ valkey_searxng_password }}"
        rules: "{{ valkey_app_rules }}"
      - user: "{{ valkey_immich_user }}"
        password: "{{ valkey_immich_password }}"
        rules: "{{ valkey_app_rules }}"
      - user: "{{ valkey_paperless_user }}"
        password: "{{ valkey_paperless_password }}"
        rules: "{{ valkey_app_rules }}"
      - user: "{{ valkey_litellm_user }}"
        password: "{{ valkey_litellm_password }}"
        rules: "{{ valkey_app_rules }}"
      # Prometheus redis_exporter: read-only plus the introspection
      # subcommands it scrapes (INFO/CONFIG/CLIENT/LATENCY/SLOWLOG/MEMORY are
      # in @dangerous, hence re-granted after the denial).
      - user: "{{ valkey_exporter_user }}"
        password: "{{ valkey_exporter_password }}"
        rules:
          - "~*"
          - "&*"
          - "+@read"
          - "+@connection"
          - "-@admin"
          - "-@dangerous"
          - "+ping"
          - "+info"
          - "+config|get"
          - "+client|list"
          - "+client|info"
          - "+latency|history"
          - "+latency|latest"
          - "+latency|histogram"
          - "+slowlog|get"
          - "+memory|usage"
          - "+memory|stats"
          - "+cluster|info"

  tasks:
    - name: Install database packages
      ansible.builtin.apt:
        name:
          - postgresql
          - postgresql-contrib
          - mariadb-server
          - mariadb-client
          - valkey-server
          - valkey-tools
          - ufw
          - python3-psycopg2
          - python3-pymysql
        state: present
        update_cache: true

    - name: Install pgvector for PostgreSQL {{ postgresql_version }} (VectorChord dependency, for Immich)
      ansible.builtin.apt:
        name: "postgresql-{{ postgresql_version }}-pgvector"
        state: present

    - name: Download the VectorChord package (for Immich)
      ansible.builtin.get_url:
        url: "https://github.com/tensorchord/VectorChord/releases/download/{{ vectorchord_version }}/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}-1_amd64.deb"
        dest: "/tmp/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}.deb"
        mode: "0644"

    - name: Install the VectorChord package (for Immich)
      ansible.builtin.apt:
        deb: "/tmp/postgresql-{{ postgresql_version }}-vchord_{{ vectorchord_version }}.deb"
        state: present

    - name: Ensure PostgreSQL is enabled and started
      ansible.builtin.service:
        name: postgresql
        enabled: true
        state: started

    - name: Ensure MariaDB is enabled and started
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    # The packaged postgresql@.service hardcodes `pg_ctlcluster -m fast` for
    # ExecStop, which aborts in-flight transactions/connections immediately
    # rather than letting clients finish - every "Restart PostgreSQL" handler
    # run below then drops every open connection instantly (seen killing
    # long-running clients like immich-analyze mid-batch). Smart mode instead
    # waits for clients to disconnect on their own before shutting down.
    - name: Ensure the PostgreSQL systemd override directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/postgresql@{{ postgresql_version }}-main.service.d"
        state: directory
        mode: "0755"

    - name: Use a graceful (smart) shutdown mode for PostgreSQL restarts
      ansible.builtin.copy:
        dest: "/etc/systemd/system/postgresql@{{ postgresql_version }}-main.service.d/override.conf"
        mode: "0644"
        content: |
          [Service]
          ExecStop=
          ExecStop=/usr/bin/pg_ctlcluster --skip-systemctl-redirect -m smart %i stop
      notify: Reload systemd daemon

    - name: Ensure Valkey is enabled and started
      ansible.builtin.service:
        name: valkey-server
        enabled: true
        state: started

    # PostgreSQL, MariaDB and Valkey are bound to all interfaces below and rely
    # on UFW to limit them to the Docker bridge network. Refuse to continue if
    # UFW isn't actually filtering - enabling it here could lock out SSH or
    # other host services, so that stays a manual decision.
    - name: Check that UFW is active (the database ports rely on it)
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: "'Status: active' not in ufw_status.stdout"

    - name: Check for /etc/mysql/mariadb.cnf
      ansible.builtin.stat:
        path: /etc/mysql/mariadb.cnf
      register: mariadb_cnf_stat

    # This is the file that `!includedir /etc/mysql/mariadb.conf.d/`s the fragments
    # below into the server's config. Found it missing on this host (a dpkg conffile
    # that had gone missing) - without it, everything under mariadb.conf.d/ is silently
    # ignored by mariadbd, including bind-address and max_connect_errors further down.
    # `apt` sees the package as already installed and won't restore it on its own, so
    # reinstall explicitly whenever the file is absent.
    - name: Restore /etc/mysql/mariadb.cnf if missing
      ansible.builtin.command: apt-get install --reinstall -y mariadb-common
      when: not mariadb_cnf_stat.stat.exists
      notify: Restart MariaDB

    - name: Allow MariaDB connections from Docker networks
      ansible.builtin.lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^\s*bind-address\s*='
        line: "bind-address = 0.0.0.0"
      notify: Restart MariaDB

    - name: Allow MariaDB from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "3306"
        proto: tcp

    - name: Allow PostgreSQL to listen on all interfaces
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^#?\s*listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Preload the VectorChord library (for Immich)
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^#?\s*shared_preload_libraries\s*='
        line: "shared_preload_libraries = 'vchord'"
      notify: Restart PostgreSQL

    # SIGHUP-level setting - takes effect on reload, no need to drop connections.
    - name: Kill stuck open transactions after 10 minutes idle
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^#?\s*idle_in_transaction_session_timeout\s*='
        line: "idle_in_transaction_session_timeout = 10min"
      notify: Reload PostgreSQL

    # pg_hba.conf is re-read on reload too - no restart needed.
    - name: Allow PostgreSQL connections from Docker networks
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_hba_path }}"
        contype: host
        databases: all
        users: all
        source: "{{ docker_network }}"
        method: scram-sha-256
      notify: Reload PostgreSQL

    - name: Allow PostgreSQL from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "5432"
        proto: tcp

    - name: Allow Valkey to listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^bind\s'
        line: "bind * -::*"
      notify: Restart Valkey

    - name: Set the Valkey default-user password
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*requirepass\s'
        line: "requirepass {{ valkey_root_password }}"
      notify: Restart Valkey

    - name: Enable Valkey AOF persistence
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^appendonly\s'
        line: "appendonly yes"
      notify: Restart Valkey

    - name: Ensure the Valkey ACL file exists
      ansible.builtin.copy:
        dest: /etc/valkey/users.acl
        content: ""
        force: false
        owner: valkey
        group: valkey
        mode: "0640"

    # Without an aclfile, ACL SETUSER only lives in memory and every user created
    # below is silently wiped out on the next Valkey restart/reboot.
    - name: Configure the Valkey ACL file
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*aclfile\s'
        line: "aclfile /etc/valkey/users.acl"
      notify: Restart Valkey

    # volatile-lru only evicts keys with a TTL set, so Immich's BullMQ job-queue
    # keys (no TTL) are left alone under memory pressure - only cache-style keys
    # with a TTL (SearXNG, etc.) get evicted.
    - name: Cap Valkey memory usage
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*maxmemory\s'
        line: "maxmemory {{ valkey_maxmemory }}"
      notify: Restart Valkey

    - name: Set the Valkey eviction policy
      ansible.builtin.lineinfile:
        path: /etc/valkey/valkey.conf
        regexp: '^#?\s*maxmemory-policy\s'
        line: "maxmemory-policy {{ valkey_maxmemory_policy }}"
      notify: Restart Valkey

    - name: Allow Valkey from Docker networks in UFW
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: "{{ docker_network }}"
        to_port: "6379"
        proto: tcp

    - name: Apply service restarts before configuring users/ACLs over the network
      ansible.builtin.meta: flush_handlers

    - name: Ensure PostgreSQL user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_user }}"
        password: "{{ postgres_password }}"
        role_attr_flags: CREATEDB,NOSUPERUSER
        state: present
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Ensure PostgreSQL database exists
      community.postgresql.postgresql_db:
        name: "{{ postgres_db }}"
        owner: "{{ postgres_user }}"
        state: present
      become_user: postgres
      vars:
        ansible_ssh_pipelining: true

    - name: Ensure PostgreSQL root password is set
      community.postgresql.postgresql_user:
        name: "{{ postgres_root_user }}"
        password: "{{ postgres_root_password }}"
        role_attr_flags: SUPERUSER
        state: present
      become_user: postgres
      when: postgres_root_password is defined and postgres_root_password | length > 0

    - name: Ensure PostgreSQL admin user exists for Oskar (pgAdmin login)
      community.postgresql.postgresql_user:
        name: "{{ postgres_admin_user }}"
        password: "{{ postgres_admin_password }}"
        role_attr_flags: CREATEDB,SUPERUSER
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL exporter user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_exporter_user }}"
        password: "{{ postgres_exporter_password }}"
        state: present
      become_user: postgres

    - name: Grant pg_monitor to the PostgreSQL exporter user
      community.postgresql.postgresql_membership:
        group: pg_monitor
        target_role: "{{ postgres_exporter_user }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL Grafana user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_grafana_user }}"
        password: "{{ postgres_grafana_password }}"
        state: present
      become_user: postgres

    - name: Grant pg_read_all_data to the PostgreSQL Grafana user
      community.postgresql.postgresql_membership:
        group: pg_read_all_data
        target_role: "{{ postgres_grafana_user }}"
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL app users exist
      community.postgresql.postgresql_user:
        name: "{{ item.user }}"
        password: "{{ item.password }}"
        state: present
      become_user: postgres
      loop: "{{ postgres_app_databases }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Ensure PostgreSQL app databases exist
      community.postgresql.postgresql_db:
        name: "{{ item.db }}"
        owner: "{{ item.user }}"
        state: present
      become_user: postgres
      loop: "{{ postgres_app_databases }}"
      loop_control:
        label: "{{ item.name }}"

    # Immich needs VectorChord (vchord, superuser-only) for embeddings and
    # earthdistance (which cascades in its cube dependency) for geo search -
    # both are created here as the postgres superuser, then left owned by
    # that database rather than the immich_user role.
    - name: Ensure the vchord extension exists in the Immich database
      community.postgresql.postgresql_ext:
        db: "{{ immich_db }}"
        name: vchord
        cascade: true
        state: present
      become_user: postgres

    - name: Ensure the earthdistance extension exists in the Immich database
      community.postgresql.postgresql_ext:
        db: "{{ immich_db }}"
        name: earthdistance
        cascade: true
        state: present
      become_user: postgres

    - name: Ensure PostgreSQL backup user exists
      community.postgresql.postgresql_user:
        name: "{{ postgres_backup_user }}"
        password: "{{ postgres_backup_password }}"
        state: present
      become_user: postgres

    # Read-only, enough for pg_dump of every database and pg_dumpall
    # --globals-only --no-role-passwords (../backup-postgres.sh).
    - name: Grant pg_read_all_data to the PostgreSQL backup user
      community.postgresql.postgresql_membership:
        group: pg_read_all_data
        target_role: "{{ postgres_backup_user }}"
        state: present
      become_user: postgres

    - name: Ensure MariaDB root password is set
      community.mysql.mysql_user:
        name: "{{ mariadb_root_user }}"
        password: "{{ mariadb_root_password }}"
        plugin: mysql_native_password
        login_unix_socket: /run/mysqld/mysqld.sock
        login_user: "{{ mariadb_root_user }}"
        login_password: "{{ mariadb_root_password }}"
        check_implicit_admin: true
        state: present
      when: mariadb_root_password is defined and mariadb_root_password | length > 0

    - name: Ensure MariaDB app user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_user }}"
        password: "{{ mariadb_password }}"
        host: localhost
        priv: "{{ mariadb_database }}.*:ALL,GRANT"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB database exists
      community.mysql.mysql_db:
        name: "{{ mariadb_database }}"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB exporter user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_exporter_user }}"
        password: "{{ mariadb_exporter_password }}"
        host: "%"
        priv:
          "*.*": "PROCESS,REPLICATION CLIENT,SLAVE MONITOR"
          "performance_schema.*": "SELECT"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB Grafana user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_grafana_user }}"
        password: "{{ mariadb_grafana_password }}"
        host: "%"
        priv:
          "*.*": "SELECT,PROCESS"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB database exists for Uptime Kuma
      community.mysql.mysql_db:
        name: "{{ uptime_kuma_db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_general_ci
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Ensure MariaDB user exists for Uptime Kuma
      community.mysql.mysql_user:
        name: "{{ uptime_kuma_db_user }}"
        password: "{{ uptime_kuma_db_password }}"
        host: "%"
        priv: "{{ uptime_kuma_db_name }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    # Read-only, enough for mysqldump --single-transaction --routines --events
    # --triggers of every database (../backup-mariadb.sh). Socket-only.
    - name: Ensure MariaDB backup user exists
      community.mysql.mysql_user:
        name: "{{ mariadb_backup_user }}"
        password: "{{ mariadb_backup_password }}"
        host: localhost
        priv:
          "*.*": "SELECT,SHOW VIEW,TRIGGER,LOCK TABLES,EVENT"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
        login_unix_socket: /run/mysqld/mysqld.sock

    - name: Write backup.env for the nightly backup scripts
      ansible.builtin.copy:
        dest: "{{ backup_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          # Managed by ansible/local-databases.yml - edit vars/local-databases.yml instead.
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER={{ postgres_backup_user }}
          POSTGRES_PASSWORD={{ postgres_backup_password }}

          MARIADB_HOST=localhost
          MARIADB_PORT=3306
          MARIADB_USER={{ mariadb_backup_user }}
          MARIADB_PASSWORD={{ mariadb_backup_password }}

          BACKUP_ROOT={{ backup_root }}
          BACKUP_PUSHGATEWAY_URL={{ backup_pushgateway_url }}
      no_log: true

    - name: Configure Uptime Kuma database connection
      ansible.builtin.copy:
        dest: "{{ uptime_kuma_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          DB_TYPE=mysql
          DB_HOST={{ uptime_kuma_db_host }}
          DB_PORT={{ uptime_kuma_db_port }}
          DB_NAME={{ uptime_kuma_db_name }}
          DB_USER={{ uptime_kuma_db_user }}
          DB_PASSWORD={{ uptime_kuma_db_password }}

    # Once aclfile is configured (above), Valkey sources the default user's
    # credentials from that file, not from requirepass in valkey.conf - requirepass
    # only seeds the default user when no aclfile is in use. The aclfile task creates
    # an empty users.acl, so without this the default user ends up on `nopass`
    # regardless of requirepass. On the very first run the default user has no
    # password yet, so this -a auth attempt itself gets rejected by the server (a
    # benign stderr warning, not a real failure - see failed_when below); the
    # ACL SETUSER still goes through because auth isn't required yet.
    - name: Ensure the Valkey default user's password matches requirepass
      ansible.builtin.command:
        argv: "{{ valkey_cli + ['ACL', 'SETUSER', 'default', 'on', '>' ~ valkey_root_password, '~*', '&*', '+@all'] }}"
      register: valkey_acl_default
      changed_when: true
      failed_when: "'ERR' in valkey_acl_default.stdout"
      no_log: true

    # Valkey ACL has no per-database restriction - a `db=N` SETUSER modifier is a
    # syntax error, not a scoping rule. The actual db isolation for these users
    # comes from each app selecting its own db index after connecting.
    # valkey-cli exits 0 even when the server replies with an error, and stderr
    # can carry a benign "AUTH failed" diagnostic, so only stdout is checked.
    - name: Ensure Valkey ACL users exist
      ansible.builtin.command:
        argv: "{{ valkey_cli + ['ACL', 'SETUSER', item.user, 'on', '>' ~ item.password] + item.rules }}"
      loop: "{{ valkey_acl_users }}"
      register: valkey_acl_user
      changed_when: true
      failed_when: "'ERR' in valkey_acl_user.stdout"
      no_log: true

    - name: Persist the Valkey ACL to disk if an ACL file is configured
      ansible.builtin.command:
        argv: "{{ valkey_cli + ['ACL', 'SAVE'] }}"
      register: valkey_acl_save
      changed_when: false
      failed_when: false

    - name: Show Valkey ACL persistence result
      ansible.builtin.debug:
        msg: >-
          {{ valkey_acl_save.stdout | default('') }}
          {{ valkey_acl_save.stderr | default('') }}
          (if this reports no ACL file is configured, the user lives in memory only
          and ACL SETUSER must be re-run after a Valkey restart)

    - name: Write PostgreSQL exporter env file for server-observability
      ansible.builtin.copy:
        dest: "{{ postgres_exporter_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          DATA_SOURCE_NAME=postgresql://{{ postgres_exporter_user }}:{{ postgres_exporter_password }}@{{ docker_gateway_ip }}:5432/{{ postgres_db }}?sslmode=disable

    - name: Write MariaDB exporter my.cnf for server-observability
      ansible.builtin.copy:
        dest: "{{ mariadb_exporter_cnf_file }}"
        owner: oskar
        group: oskar
        # mysqld_exporter (v0.15+) reads credentials from this file directly, running as an
        # unprivileged container user - it must be world-readable like uptime-kuma-metrics-token.
        mode: "0644"
        content: |
          [client]
          user = {{ mariadb_exporter_user }}
          password = {{ mariadb_exporter_password }}

    - name: Write Valkey exporter env file for server-observability
      ansible.builtin.copy:
        dest: "{{ valkey_exporter_env_file }}"
        owner: oskar
        group: oskar
        mode: "0600"
        content: |
          REDIS_ADDR=redis://{{ docker_gateway_ip }}:{{ valkey_port }}
          REDIS_USER={{ valkey_exporter_user }}
          REDIS_PASSWORD={{ valkey_exporter_password }}

    # Passwords stay in vars/local-databases.yml - never printed here.
    - name: Show where to put the database credentials
      ansible.builtin.debug:
        msg:
          - "Grafana (server-observability/terraform.tfvars): postgres_grafana_user/password and mariadb_grafana_user/password from vars/local-databases.yml."
          - "Immich (media-services/immich.env): DB_HOSTNAME=host.docker.internal, DB_USERNAME/DB_PASSWORD/DB_DATABASE_NAME = immich_user/immich_password/immich_db; REDIS_HOSTNAME=host.docker.internal, REDIS_USERNAME/REDIS_PASSWORD/REDIS_DBINDEX = valkey_immich_user/valkey_immich_password/valkey_immich_db."
          - "Mealie (media-services/mealie.env): POSTGRES_SERVER=host.docker.internal, POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB = mealie_user/mealie_password/mealie_db."
          - "Paperless-ngx (media-services/paperless.env): PAPERLESS_DBHOST=host.docker.internal, PAPERLESS_DBUSER/PAPERLESS_DBPASS/PAPERLESS_DBNAME = paperless_*; PAPERLESS_REDIS=redis://<valkey_paperless_user>:<valkey_paperless_password>@host.docker.internal:6379/<valkey_paperless_db>."
          - "LiteLLM (home-server-tools/ai/litellm.env): DATABASE_URL=postgresql://<litellm_user>:<litellm_password>@host.docker.internal:5432/<litellm_db>; REDIS_HOST=host.docker.internal, REDIS_PORT=6379, REDIS_USERNAME/REDIS_PASSWORD/REDIS_DB = valkey_litellm_*."
          - "Seerr (media-services/seerr.env): DB_TYPE=postgres, DB_HOST=host.docker.internal, DB_USER/DB_PASS/DB_NAME = seerr_user/seerr_password/seerr_db."
          - "SearXNG (home-server-tools/ai/searxng.env): SEARXNG_VALKEY_URL=valkey://<valkey_searxng_user>:<valkey_searxng_password>@host.docker.internal:6379/<valkey_searxng_db>."
          - "Pocket ID (home-server-tools/auth/.env): DB_CONNECTION_STRING=postgresql://<pocketid_user>:<pocketid_password>@host.docker.internal:5432/<pocketid_db>?sslmode=disable."
          - "tinyauth (home-server-tools/auth/.env): TINYAUTH_DATABASE_DRIVER=postgres, TINYAUTH_DATABASE_PATH=postgresql://<tinyauth_user>:<tinyauth_password>@host.docker.internal:5432/<tinyauth_db>?sslmode=disable."
          - "pgAdmin: the postgres_admin_user password is entered by hand at first login (home-server-tools/pgadmin/README.md)."
          - "Backups: {{ backup_env_file }} was written for ../backup-postgres.sh and ../backup-mariadb.sh."

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted

    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Reload PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: reloaded

    - name: Restart Valkey
      ansible.builtin.service:
        name: valkey-server
        state: restarted
