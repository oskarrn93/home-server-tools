services:
  pocket-id:
    image: pocketid/pocket-id:v2.14.0
    container_name: pocket-id
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: volume
        source: pocketid_data
        target: /app/data
        volume:
          nocopy: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`oidc.oskarrosen.io`)"
      - "traefik.http.routers.pocketid.entrypoints=web,web_secure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.routers.pocketid.tls.certresolver=lets_encrypt"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - traefik_internal

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5.1.3
    container_name: tinyauth
    restart: unless-stopped
    depends_on:
      - pocket-id
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: volume
        source: tinyauth_data
        target: /data
        volume:
          nocopy: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tinyauth.rule=Host(`auth.oskarrosen.io`)"
      - "traefik.http.routers.tinyauth.entrypoints=web,web_secure"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.routers.tinyauth.tls.certresolver=lets_encrypt"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_internal"
    networks:
      - default
      - traefik_internal

volumes:
  pocketid_data:
  tinyauth_data:

networks:
  traefik_internal:
    external: true
